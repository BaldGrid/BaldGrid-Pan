<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白叶141の资源站</title>
    <style>
        /* ===== 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            color: #333;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        body.dark-mode header {
            background: rgba(26, 26, 46, 0.85);
        }
        body.dark-mode .main-item-list {
            background: rgba(30, 30, 50, 0.85);
            border-color: #333;
        }
        body.dark-mode .main-items:hover {
            background: rgba(255,255,255,0.05);
        }
        body.dark-mode a {
            color: #8ab4f8;
        }
        body.dark-mode a:hover {
            color: #bbd9ff;
        }
        body.dark-mode .toggle-switch {
            background: #444;
        }
        body.dark-mode .toggle-switch.active {
            background: #1a73e8;
        }
        body.dark-mode .detail-modal {
            background: #2a2a3e;
            color: #e0e0e0;
        }
        body.dark-mode .detail-header,
        body.dark-mode .detail-footer {
            border-color: #444;
        }
        body.dark-mode .detail-body .detail-item {
            border-color: #444;
        }
        body.dark-mode .detail-body .detail-readme {
            background: #1a1a2e;
        }
        body.dark-mode .friend-link-item {
            background: rgba(255,255,255,0.05);
            border-color: #444;
        }
        body.dark-mode .friend-link-item:hover {
            background: rgba(255,255,255,0.1);
        }
        body.dark-mode .link-card:hover {
            background: rgba(255,255,255,0.05);
        }
        body.dark-mode .settings-item {
            border-color: #444;
        }
        body.dark-mode .thanks-box {
            background: rgba(255,255,255,0.05);
            border-color: #444;
        }
        body.dark-mode .thanks-item {
            border-color: #444;
        }
        body.dark-mode .thanks-item:hover {
            background: rgba(255,255,255,0.05);
        }
        body.dark-mode .img-preview-modal {
            background: #2a2a3e;
        }
        body.dark-mode .img-preview-body {
            background: #1a1a2e;
        }
        body.dark-mode .img-preview-footer {
            background: #2a2a3e;
            border-color: #444;
        }
        body.dark-mode .spinner {
            border-color: #444;
            border-top-color: #1a73e8;
        }
        body.dark-mode .search-bar {
            background: rgba(255,255,255,0.05);
            border-color: #444;
            color: #e0e0e0;
        }
        body.dark-mode .search-bar::placeholder {
            color: #888;
        }
        body.dark-mode .view-toggle-btn {
            background: rgba(255,255,255,0.05);
            color: #aaa;
        }
        body.dark-mode .view-toggle-btn.active {
            background: rgba(255,255,255,0.15);
            color: #e0e0e0;
        }
        body.dark-mode .back-btn {
            background: rgba(255,255,255,0.08);
            color: #aaa;
        }
        body.dark-mode .back-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        #statsDisplay {
            font-size: 13px;
            color: #888;
            padding: 0 8px;
            white-space: nowrap;
        }
        a {
            text-decoration: none;
            font-weight: 400;
            color: rgb(97, 97, 97);
            transition: 0.5s;
            cursor: pointer;
        }
        a:hover {
            color: rgb(36, 36, 36);
        }
        ul {
            list-style: none;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            position: relative;
        }
        .container {
            margin-left: auto;
            margin-right: auto;
            max-width: 1100px;
        }
        header {
            width: 100%;
            line-height: 48px;
            background-color: rgba(255, 255, 255, 0.5);
            position: fixed;
            z-index: 10;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
        }
        header nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            height: 48px;
        }
        header nav a {
            color: rgb(36, 36, 36);
            font-weight: 600;
            transition: 0.5s;
        }
        body.dark-mode header nav a {
            color: #e0e0e0;
        }
        nav svg {
            width: 20px;
            height: 20px;
        }
        nav div {
            min-width: 48px;
            height: 48px;
            transition: 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pull-left {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pull-right {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .expand {
            transform: rotate(0deg);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255,255,255,0.65);
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
            margin: 3px 4px;
        }
        .expand:hover {
            background: rgba(0,0,0,.08);
        }
        body.dark-mode .expand {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 2px 10px rgba(0,0,0,.3);
        }
        body.dark-mode .expand:hover {
            background: rgba(255,255,255,0.15);
        }
        nav a {
            padding: 0 12px;
        }
        nav div:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark-mode nav div:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        main {
            position: relative;
            height: 100%;
            background: #f0f0f4;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            transition: background 0.3s;
        }
        body.dark-mode main {
            background: #1a1a2e;
        }
        .scroll {
            overflow-y: auto;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 48px 0 100px 0;
        }
        .scroll::-webkit-scrollbar {
            width: 5px;
        }
        .scroll::-webkit-scrollbar-thumb {
            background: #a8a8a8;
        }
        .scroll::-webkit-scrollbar-button {
            display: none;
        }
        body.dark-mode .scroll::-webkit-scrollbar-thumb {
            background: #555;
        }
        main .main-item-list {
            display: flex;
            flex-direction: column;
            height: auto;
            background: rgba(255, 255, 255, 0.8);
            margin: 20px;
            line-height: 32px;
            font-size: 14px;
            box-sizing: border-box;
            border-radius: 12px;
            border: #e0e0e0 solid 1px;
            padding: 12px 0;
            backdrop-filter: blur(20px);
            transition: 0.3s, background 0.3s, border-color 0.3s;
        }
        main .main-title h1 {
            margin: 0;
            padding: 32px 32px 10px 32px;
            font-size: 19px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        div.main-title>h1>a:last-of-type {
            font-weight: 600;
            color: rgb(36, 36, 36);
        }
        body.dark-mode div.main-title>h1>a:last-of-type {
            color: #e0e0e0;
        }
        main .main-item-list .inner-container {
            display: flex;
            justify-content: flex-start;
            width: 100%;
            height: auto;
            box-sizing: border-box;
        }
        main .main-item-list .inner-container>div {
            padding-left: 12px;
            padding-right: 8px;
            box-sizing: border-box;
            text-wrap: nowrap;
            font-weight: 600;
        }
        div.main-items.main-item-title>div>div.main-items-icon {
            display: none;
        }
        main .main-item-list .main-item-title {
            border-bottom: 1px solid #EAEAEA;
        }
        body.dark-mode main .main-item-list .main-item-title {
            border-color: #444;
        }
        main .main-items {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            padding: 0 20px;
            overflow: hidden;
            transition: 0.3s;
            margin-top: 2.5px;
            margin-bottom: 2.5px;
            cursor: default;
            min-height: 48px;
            transform: translateZ(0);
            will-change: transform, opacity;
        }
        main .main-items:hover {
            background-color: #F4F4F4;
            transform: scale(0.980);
            border-radius: 10px;
            transition: 0.3s;
        }
        body.dark-mode main .main-items:hover {
            background: rgba(255,255,255,0.05);
        }
        main .main-item-list .main-items-icon {
            min-width: 38px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        main .main-item-list .main-items-icon img {
            display: block;
            width: 20px;
            height: 20px;
        }
        main .main-item-list .main-items-icon .iconfont {
            font-size: 20px;
            line-height: 1;
        }
        main .main-item-title .main-items-icon {
            height: 32px !important;
            line-height: 9px !important;
        }
        main .main-item-title .main-items-icon:hover,
        main .main-item-list .main-items-displayName:hover,
        main .main-item-list .main-items-dateModified:hover,
        main .main-item-list .main-items-size:hover {
            background-color: #EAEAEA;
        }
        body.dark-mode main .main-item-title .main-items-icon:hover,
        body.dark-mode main .main-item-list .main-items-displayName:hover,
        body.dark-mode main .main-item-list .main-items-dateModified:hover,
        body.dark-mode main .main-item-list .main-items-size:hover {
            background-color: rgba(255,255,255,0.05);
        }
        main .main-item-list .main-items-displayName,
        main .main-item-list .main-items-fileName {
            flex: 1;
            padding: 11px 8px 11px 12px;
            min-height: 42px;
            line-height: 22px;
            font-family: "Microsoft Yahei UI", Verdana, Simsun, "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        main .main-item-list .main-items-fileName .name-text {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
        }
        main .main-item-list .main-items-fileName .desc-text {
            color: #999;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        main .main-item-list .main-items-fileName a {
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            color: inherit;
            align-items: center;
            max-width: 100%;
            white-space: nowrap;
        }
        main .main-item-list .main-items-fileName a:hover {
            text-decoration: underline;
        }
        main .main-item-list .main-items-dateModified,
        main .main-item-list .main-items-dateTime {
            width: 140px;
            text-align: center;
            flex: 1;
            padding: 11px 8px 11px 12px;
            min-height: 42px;
            line-height: 22px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main .main-item-list .main-items-size,
        main .main-item-list .main-items-fileSize {
            padding: 11px 8px 11px 12px;
            min-height: 42px;
            line-height: 22px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
            gap: 6px;
        }
        .file-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .file-actions a {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        .file-actions .btn-detail {
            color: #0078d4;
            background: rgba(0, 120, 212, 0.08);
        }
        .file-actions .btn-detail:hover {
            background: rgba(0, 120, 212, 0.15);
        }
        .folder-info {
            color: #999;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        @media screen and (max-width: 600px) {
            .file-actions a {
                padding: 2px 8px;
                font-size: 11px;
            }
            .file-actions {
                gap: 4px;
            }
            main .main-item-list .main-items-fileSize {
                padding: 11px 4px;
            }
            .desc-text {
                display: none !important;
            }
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #999;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .readme {
            padding: 10px 20px;
        }
        .markdown-body {
            font-size: 14px;
            line-height: 1.8;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin: 16px 0 8px 0;
        }
        .markdown-body ul {
            padding-left: 20px;
        }
        .markdown-body code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        body.dark-mode .markdown-body code {
            background: #333;
        }
        #foot_info {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #888;
        }
        #sidebarOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 8;
            transition: background 0.3s ease;
            pointer-events: none;
            display: none;
        }
        #sidebarOverlay.active {
            background: rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }
        #sidebar {
            position: fixed;
            background: white;
            height: 100%;
            padding: 20px;
            padding-top: 60px;
            width: 220px;
            transition: 0.5s;
            display: flex;
            flex-direction: column;
            z-index: 9;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transform: translateX(-260px);
            overflow-y: auto;
        }
        body.dark-mode #sidebar {
            background: #2a2a3e;
        }
        #sidebar svg {
            min-width: 24px;
            height: 24px;
            padding-right: 15px;
        }
        .multidisk {
            display: flex;
            font-size: 16px;
            padding: 10px;
            transition: 0.5s;
            margin: 2px 0;
            align-items: center;
            justify-content: flex-start;
            border-radius: 8px;
            cursor: pointer;
        }
        .multidisk:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark-mode .multidisk:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .curr-disk {
            background: rgba(0, 120, 212, 0.1);
            font-weight: 600;
            color: #0078d4;
        }
        body.dark-mode .curr-disk {
            background: rgba(26, 115, 232, 0.2);
            color: #8ab4f8;
        }
        .folder-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .folder-item:active {
            transform: scale(0.95);
            background-color: #e8f0fe;
        }
        body.dark-mode .folder-item:active {
            background-color: rgba(26, 115, 232, 0.2);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        #fileItems .main-items {
            animation: fadeInUp 0.3s ease forwards;
        }
        .readme-item {
            opacity: 1 !important;
            animation: none !important;
        }
        .readme-content-wrapper {
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .readme-content-wrapper.entering {
            animation: readmeEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .readme-content-wrapper.exiting {
            opacity: 0;
            transform: translateY(-10px) scale(0.97);
            pointer-events: none;
        }
        @keyframes readmeEnter {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.95);
            }
            60% {
                opacity: 1;
                transform: translateY(-3px) scale(1.005);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        #fileList,
        #specialPageContainer,
        #introContainer,
        #readmeContainer {
            will-change: opacity, transform;
            backface-visibility: hidden;
        }
        .spinner-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #0078d4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner-text {
            color: #999;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        .detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.2s ease, backdrop-filter 0.2s ease;
            display: flex;
            pointer-events: none;
        }
        .detail-overlay.active {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        .detail-overlay.closing {
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            pointer-events: none;
        }
        .detail-overlay.closing .detail-modal {
            transform: scale(0.95) translateY(20px);
            opacity: 0;
        }
        .detail-modal {
            background: white;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }
        .detail-overlay.active .detail-modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .detail-header h3 {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 80%;
        }
        .detail-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0 8px;
            transition: 0.2s;
            line-height: 1;
        }
        .detail-close:hover {
            color: #333;
            transform: scale(1.1);
        }
        .detail-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            font-size: 14px;
            line-height: 1.8;
        }
        .detail-body .detail-item {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-body .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .detail-body .detail-label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .detail-body .detail-value {
            color: #333;
            word-break: break-all;
        }
        .detail-body .detail-value a {
            color: #0078d4;
        }
        .detail-body .detail-value a:hover {
            text-decoration: underline;
        }
        .detail-body .detail-readme {
            background: #f8f8fa;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.8;
            max-height: 250px;
            overflow-y: auto;
        }
        .detail-body .detail-readme h1,
        .detail-body .detail-readme h2,
        .detail-body .detail-readme h3 {
            margin: 6px 0 4px 0;
            font-size: 15px;
        }
        .detail-body .detail-readme ul {
            padding-left: 20px;
        }
        .detail-body .detail-readme code {
            background: #e8e8e8;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .detail-body .loading-text {
            color: #999;
            text-align: center;
            padding: 20px 0;
        }
        .detail-body .error-text {
            color: #dc2626;
            text-align: center;
            padding: 20px 0;
        }
        .detail-footer {
            padding: 12px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .detail-footer a,
        .detail-footer button {
            padding: 8px 20px;
            border-radius: 8px;

                url('//at.alicdn.com/t/font_1634400_9yg8f5s278.svg#iconfont') format('svg');
        }
        .iconfont {
            font-family: "iconfont" !important;
            font-size: 16px;
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            -webkit-text-stroke-width: 0.2px;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== 触摸返回提示 ===== */
        .swipe-hint {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 5;
            transition: 0.3s;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        .swipe-hint.show {
            transform: translateY(-50%) scale(1);
        }

        /* ===== 竖屏：只保留菜单按钮 + 搜索框 ===== */
        @media screen and (max-width: 600px) {
            /* 隐藏右侧多余元素 */
            header nav .pull-right #statsDisplay {
                display: none !important;
            }
            header nav .pull-right .view-toggle-btn {
                display: none !important;
            }
            header nav .pull-right .kbd-hint {
                display: none !important;
            }
            /* 左侧菜单按钮保留 */
            header nav .pull-left {
                display: flex !important;
            }
            header nav .pull-left .expand {
                display: flex !important;
            }
            header nav .pull-left a {
                display: none !important;

            /* 右侧只保留搜索框 */
            header nav .pull-right {
                gap: 0;
                flex: 1;
                justify-content: flex-end;
            }
            header nav .pull-right .search-bar {
                width: 180px !important;
                flex-shrink: 0;
            }
            header nav .pull-right .search-bar:focus {
                width: 180px !important;
            }
            /* 导航栏保持左右布局 */
            header nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
            }
        }

        /* 平板中间状态 - 隐藏部分元素 */
        @media screen and (min-width: 601px) and (max-width: 900px) {
            header nav .pull-left a {
                display: none !important;
            }
            header nav .pull-right #statsDisplay {
                display: none !important;
            }
            header nav .pull-right .kbd-hint {
                display: none !important;
            }
            .search-bar {
                width: 140px;
            }
            .search-bar:focus {
                width: 180px;
            }
        }
    </style>
</head>

    <main>

    <script>
        // ============================================================
        // 完整修复版资源站 - 修复3个bug
        // 1. README加载修复：正确加载json里的readme路径
        // 2. 去掉根目录右边的返回按钮
        // 3. 资源加载时切换选项卡，加载完毕不会强行跳回
        // ============================================================

        // ===== 配置 =====
        const CONFIG = {
            cacheEnabled: true,
            maxCacheSize: 50,
            retryCount: 2,
            retryDelay: 1000,
            darkModeKey: 'baldgrid-darkmode',
            viewModeKey: 'baldgrid-viewmode',
            musicKey: 'baldgrid-music',
        };

        // ===== 全局状态 =====
        let allData = null;
        let currentPath = [];
        let currentCategory = null;
        let flatItems = [];
        let sidebarOpen = false;
        let currentDetailItem = null;
        let detailLink = '';
        let musicEnabled = localStorage.getItem(CONFIG.musicKey) === 'true';
        let musicList = [];
        let audioPlayer = null;
        let musicPlaying = false;
        let musicPlayedIndices = [];
        let currentSpecialPage = null;
        let isPageAnimating = false;
        let toastTimer = null;
        let introLoaded = false;
        let bgHistoryReady = false;
        let bgRestoring = false;
        let searchQuery = '';
        let currentView = localStorage.getItem(CONFIG.viewModeKey) || 'list';
        let isDarkMode = localStorage.getItem(CONFIG.darkModeKey) === 'true';
        // 修复bug3：标记是否正在加载资源，防止加载完成后跳转
        let isLoadingResources = true;
        let pendingNavigate = null;

        // ===== 缓存系统 =====
        const cache = new Map();
        const cacheOrder = [];

        function setCache(key, data) {
            if (!CONFIG.cacheEnabled) return;
            if (cacheOrder.length >= CONFIG.maxCacheSize) {
                const oldest = cacheOrder.shift();
                cache.delete(oldest);
            }
            cache.set(key, data);
            cacheOrder.push(key);
        }

        function getCache(key) {
            if (!CONFIG.cacheEnabled) return null;
            return cache.get(key) || null;
        }

        function clearCache() {
            cache.clear();
            cacheOrder.length = 0;
            showToast('✅ 缓存已清除');
        }

        // ===== 暗色模式 =====
        function applyDarkMode(enabled) {
            isDarkMode = enabled;
            localStorage.setItem(CONFIG.darkModeKey, String(enabled));
            document.body.classList.toggle('dark-mode', enabled);
            const btn = document.getElementById('darkToggle');
            if (btn) btn.textContent = enabled ? '☀️' : '🌙';
        }

        function toggleDarkMode() {
            applyDarkMode(!isDarkMode);
            showToast(isDarkMode ? '🌙 暗色模式' : '☀️ 亮色模式');
            if (currentSpecialPage === 'settings') {
                renderSettings(document.getElementById('specialPageContent'));
            }
        }

        // ===== 视图切换 =====
        function toggleView() {
            currentView = currentView === 'list' ? 'grid' : 'list';
            localStorage.setItem(CONFIG.viewModeKey, currentView);
            const btn = document.getElementById('viewToggle');
            btn.textContent = currentView === 'list' ? '☰' : '▦';
            applyViewMode();
            showToast(currentView === 'list' ? '📋 列表视图' : '▦ 网格视图');
            if (currentSpecialPage === 'settings') {
                renderSettings(document.getElementById('specialPageContent'));
            }
        }

        function applyViewMode() {
            const container = document.getElementById('fileItems');
            if (container) {
                container.classList.toggle('grid-view', currentView === 'grid');
            }
        }

        // ===== 搜索功能 =====
        function filterItems(query) {
            searchQuery = query.toLowerCase().trim();
            const items = document.querySelectorAll('#fileItems .main-items:not(.main-item-title)');
            let visibleCount = 0;
            items.forEach(item => {
                const nameEl = item.querySelector('.name-text');
                const name = nameEl ? nameEl.textContent.toLowerCase() : '';
                const show = !searchQuery || name.includes(searchQuery);
                item.style.display = show ? '' : 'none';
                if (show) visibleCount++;
            });
            const emptyState = document.querySelector('#fileItems .empty-state');
            if (visibleCount === 0 && searchQuery) {
                if (!emptyState) {
                    const wrapper = document.getElementById('fileItems');
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML = `<div class="icon">🔍</div><p>没有找到 "${searchQuery}" 相关的资源</p>`;
                    wrapper.appendChild(empty);
                }
            } else if (emptyState && (visibleCount > 0 || !searchQuery)) {
                emptyState.remove();
            }
        }

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
            if (e.key === 'Escape') {
                closeDetail();
                closeImgPreview();
                if (sidebarOpen) closeSidebar();
                document.getElementById('searchInput').blur();
            }
            if (e.altKey && e.key === 'ArrowLeft' && currentPath.length > 0) {
                e.preventDefault();
                const parentPath = currentPath.slice(0, -1);
                if (parentPath.length) navigateToByPath(parentPath.join('|'));
                else navigateTo(null);
            }
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                toggleDarkMode();
            }
            if (e.ctrlKey && e.key === 'v') {
                e.preventDefault();
                toggleView();
            }
        });

        // ===== 触摸滑动返回 =====
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        let swipeHintTimer = null;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = false;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - touchStartX;
            const deltaY = e.touches[0].clientY - touchStartY;
            if (Math.abs(deltaX) > 20 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                isSwiping = true;
                if (deltaX > 0 && currentPath.length > 0) {
                    const hint = document.getElementById('swipeHint');
                    hint.classList.add('show');
                    clearTimeout(swipeHintTimer);
                    swipeHintTimer = setTimeout(() => hint.classList.remove('show'), 2000);
                }
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            if (isSwiping && deltaX > 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                if (currentPath.length > 0) {
                    const parentPath = currentPath.slice(0, -1);
                    if (parentPath.length) navigateToByPath(parentPath.join('|'));
                    else navigateTo(null);
                    showToast('⬅ 返回上一级');
                }
            }
            document.getElementById('swipeHint').classList.remove('show');
            isSwiping = false;
        }, { passive: true });

        // ===== 重试机制 =====
        async function fetchWithRetry(url, retries = CONFIG.retryCount) {
            let lastError;
            for (let i = 0; i <= retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return res;
                    if (res.status === 404) throw new Error('文件不存在');
                    throw new Error(`HTTP ${res.status}`);
                } catch (e) {
                    lastError = e;
                    if (i < retries) {
                        await new Promise(r => setTimeout(r, CONFIG.retryDelay * (i + 1)));
                    }
                }
            }
            throw lastError;
        }

        // ===== 加载数据 =====
        async function loadData() {
            try {
                applyDarkMode(isDarkMode);

                const statsEl = document.getElementById('statsDisplay');
                if (statsEl) statsEl.textContent = '⏳ 加载中...';

                const response = await fetchWithRetry('resources.json');
                allData = await response.json();
                await loadAllLoaders(allData.categories);
                flatItems = [];
                buildFlatIndex(allData.categories, []);
                const count = flatItems.filter(i => i.type === 'loader' || i.type === 'file' || i.type === 'folder').length;
                if (statsEl) statsEl.textContent = `📦 ${count} 个资源`;
                await loadMusicList();
                await loadIntro();

                currentPath = [];
                currentSpecialPage = null;
                currentCategory = {
                    name: '根目录',
                    type: 'root',
                    children: allData.categories
                };

                applyViewMode();
                const btn = document.getElementById('viewToggle');
                if (btn) btn.textContent = currentView === 'list' ? '☰' : '▦';

                history.replaceState(
                    { __baldgrid: true, depth: 0, path: [], special: null },
                    '',
                    window.location.href
                );

                bgHistoryReady = true;
                isLoadingResources = false;

                // 如果有待处理的导航，执行它
                if (pendingNavigate) {
                    const nav = pendingNavigate;
                    pendingNavigate = null;
                    if (nav.type === 'special') {
                        showSpecialPage(nav.page, true);
                    } else {
                        navigateTo(nav.category, true);
                    }
                } else {
                    navigateTo(null, true);
                }
            } catch (error) {
                isLoadingResources = false;
                document.getElementById('fileItems').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>加载失败: ${error.message}</p>
                        <p style="font-size:13px;color:#bbb;margin-top:8px;">请确保 resources.json 文件存在且格式正确</p>
                        <p style="font-size:12px;color:#bbb;margin-top:4px;">当前路径: ${window.location.href}</p>
                    </div>
                `;
                const statsEl = document.getElementById('statsDisplay');
                if (statsEl) statsEl.textContent = '⚠️ 加载失败';
                console.error('加载失败:', error);
            }
        }

        // ===== 加载资源介绍 =====
        async function loadIntro() {
            try {
                const res = await fetchWithRetry('data/main.md');
                const text = await res.text();
                const html = renderMarkdown(text);
                const wrapper = document.querySelector('#introContainer .readme-content-wrapper');
                if (wrapper) {
                    wrapper.innerHTML = html;
                    wrapper.style.opacity = '0';
                    wrapper.style.transform = 'translateY(18px) scale(0.95)';
                }
                introLoaded = true;
                if (currentCategory && currentCategory.name === '根目录') {
                    showReadmeContainer('introContainer');
                }
            } catch (e) {
                introLoaded = false;
                console.warn('资源介绍加载失败:', e);
            }
        }

        // ===== 加载所有 loader =====
        async function loadAllLoaders(categories) {
            if (!categories || !Array.isArray(categories)) return;
            for (const cat of categories) {
                if (cat.type === 'loader' && cat.src) {
                    try {
                        let src = cat.src;
                        let anchor = null;
                        if (src.includes('#')) {
                            const parts = src.split('#');
                            src = parts[0];
                            anchor = parts[1];
                        }
                        console.log('📥 加载:', src, anchor ? `→ ${anchor}` : '');
                        const res = await fetchWithRetry(src);
                        let data = await res.json();

                        if (anchor) {
                            if (data[anchor]) {
                                data = data[anchor];
                            } else {
                                console.warn('⚠️ 锚点不存在:', anchor);
                                continue;
                            }
                        }

                        cat.type = 'folder';
                        if (data.children && Array.isArray(data.children)) {
                            cat.children = data.children;
                            if (data.desc && !cat.desc) cat.desc = data.desc;
                            // 修复bug1：正确加载readme路径
                            if (data.readme) cat.readme = data.readme;
                            // 如果有子loader，递归加载
                            await loadAllLoaders(cat.children);
                        } else if (Array.isArray(data)) {
                            cat.children = data;
                        } else {
                            cat.children = [];
                            cat._loadedData = data;
                            if (data.desc && !cat.desc) cat.desc = data.desc;
                            if (data.url) cat._url = data.url;
                            // 修复bug1：正确加载readme
                            if (data.readme) {
                                cat.readme = data.readme;
                                try {
                                    const rmRes = await fetchWithRetry(data.readme);
                                    cat._loadedReadme = await rmRes.text();
                                } catch (e) {
                                    console.warn('📄 README 加载失败:', data.readme);
                                }
                            }
                        }

                        // 如果cat有children，确保递归加载它们的loader
                        if (cat.children && Array.isArray(cat.children)) {
                            await loadAllLoaders(cat.children);
                        }
                    } catch (e) {
                        console.warn('❌ 加载失败:', cat.src, e);
                        cat.type = 'folder';
                        cat.children = [];
                    }
                } else if (cat.children && Array.isArray(cat.children)) {
                    await loadAllLoaders(cat.children);
                }
            }
        }

        function buildFlatIndex(categories, parentPath = []) {
            if (!categories || !Array.isArray(categories)) return;
            categories.forEach(cat => {
                const fullPath = [...parentPath, cat.name];
                cat._path = fullPath;
                flatItems.push({ ...cat, _path: fullPath, _pathStr: fullPath.join(' / ') });
                if (cat.children && Array.isArray(cat.children)) {
                    buildFlatIndex(cat.children, fullPath);
                }
            });
        }

        // ===== 音乐功能 =====
        async function loadMusicList() {
            try {
                const response = await fetchWithRetry('data/music.json');
                musicList = await response.json();
                if (musicEnabled && musicList.length > 0) {
                    setTimeout(() => playRandomMusic(), 500);
                }
            } catch (e) {
                console.warn('音乐列表加载失败:', e);
                musicList = [];
            }
        }

        function toggleMusic() {
            if (!musicEnabled) {
                if (audioPlayer) {
                    audioPlayer.pause();
                    audioPlayer = null;
                }
                musicPlaying = false;
                showToast('🔇 音乐已关闭');
                localStorage.setItem(CONFIG.musicKey, 'false');
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
                return;
            }
            if (musicList.length === 0) {
                showToast('❌ 没有可播放的音乐');
                return;
            }
            if (audioPlayer && musicPlaying) {
                audioPlayer.pause();
                musicPlaying = false;
                showToast('⏸️ 已暂停');
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
                return;
            }
            if (audioPlayer && !musicPlaying) {
                audioPlayer.play().catch(() => {});
                musicPlaying = true;
                showToast('▶️ 继续播放');
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
                return;
            }
            playRandomMusic();
        }

        function playRandomMusic() {
            if (musicList.length === 0) return;
            if (musicPlayedIndices.length >= musicList.length) {
                musicPlayedIndices = [];
            }
            const availableIndices = [];
            for (let i = 0; i < musicList.length; i++) {
                if (!musicPlayedIndices.includes(i)) {
                    availableIndices.push(i);
                }
            }
            if (availableIndices.length === 0) {
                musicPlayedIndices = [];
                playRandomMusic();
                return;
            }
            const randomIdx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            musicPlayedIndices.push(randomIdx);
            const item = musicList[randomIdx];
            if (!item || !item.url) {
                showToast('❌ 无法播放: ' + (item ? item.name : '未知'));
                playRandomMusic();
                return;
            }
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
            audioPlayer = new Audio(item.url);
            audioPlayer.volume = 0.7;
            audioPlayer.addEventListener('ended', () => {
                if (musicEnabled) {
                    playRandomMusic();
                }
            });
            audioPlayer.addEventListener('error', () => {
                showToast('❌ 播放失败: ' + item.name);
                setTimeout(() => {
                    if (musicEnabled) {
                        playRandomMusic();
                    }
                }, 2000);
            });
            audioPlayer.play().then(() => {
                musicPlaying = true;
                showToast(`🎵 正在播放: ${item.name}`);
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
            }).catch(() => {
                showToast('❌ 无法播放: ' + item.name);
            });
        }

        function stopMusic() {
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
            musicPlaying = false;
            musicPlayedIndices = [];
        }

        // ===== 导航 =====
        function bgMakeState(path, special, depth) {
            return {
                __baldgrid: true,
                depth: depth,
                path: Array.isArray(path) ? path.slice() : [],
                special: special || null
            };
        }

        function bgPushCurrent() {
            if (!bgHistoryReady || bgRestoring) return;
            const old = history.state;
            const depth = old && old.__baldgrid ? (Number(old.depth) || 0) + 1 : 1;
            history.pushState(
                bgMakeState(currentPath, currentSpecialPage, depth),
                '',
                window.location.href
            );
        }

        function bgGoRoot() {
            if (!bgHistoryReady || bgRestoring) return;
            const state = history.state;
            if (!state || !state.__baldgrid || Number(state.depth) <= 0) return;
            history.go(-Number(state.depth));
        }

        function bgRestore(state) {
            if (!state || !state.__baldgrid || !allData) return;
            bgRestoring = true;
            if (state.special) {
                showSpecialPage(state.special, true);
            } else if (Array.isArray(state.path) && state.path.length) {
                navigateToByPath(state.path, true);
            } else {
                navigateTo(null, true);
            }
            setTimeout(() => { bgRestoring = false; }, 800);
        }

        window.addEventListener('popstate', function(event) {
            if (!bgHistoryReady) return;
            if (event.state && event.state.__baldgrid) {
                bgRestore(event.state);
            }
        });

        function navigateToByPath(pathInput, fromHistory = false) {
            hideSpecialPage(true);
            if (!pathInput) {
                navigateTo(null, fromHistory);
                return;
            }
            let names;
            if (Array.isArray(pathInput)) {
                names = pathInput;
            } else {
                names = pathInput.split('|').filter(Boolean);
            }
            if (names.length === 0) {
                navigateTo(null, fromHistory);
                return;
            }
            let current = {
                name: '根目录',
                type: 'root',
                children: allData.categories
            };
            let path = [];
            for (const name of names) {
                const next = (current.children || []).find(item => item.name === name);
                if (!next) {
                    console.warn('未找到路径:', name);
                    return;
                }
                path.push(name);
                current = next;
            }
            current._path = path;
            navigateTo(current, fromHistory);
        }

        function navigateTo(category, fromHistory = false) {
            // 修复bug3：如果还在加载资源，记录待处理的导航
            if (isLoadingResources && !fromHistory) {
                pendingNavigate = { type: 'category', category: category };
                return;
            }

            if (category === null && !fromHistory && bgHistoryReady && !bgRestoring) {
                bgGoRoot();
                return;
            }

            hideSpecialPage(true);
            const fileList = document.getElementById('fileList');
            const specialContainer = document.getElementById('specialPageContainer');
            specialContainer.style.display = 'none';

            document.getElementById('searchInput').value = '';
            searchQuery = '';

            if (fileList.style.display !== 'none') {
                fileList.classList.add('list-exit');
                setTimeout(() => {
                    fileList.classList.remove('list-exit');
                    fileList.classList.add('list-enter');
                    setTimeout(() => {
                        fileList.classList.remove('list-enter');
                    }, 400);
                }, 300);
            }

            setTimeout(() => {
                if (category === null) {
                    currentPath = [];
                    currentCategory = {
                        name: '根目录',
                        type: 'root',
                        children: allData.categories
                    };
                    if (introLoaded) {
                        const wrapper = document.querySelector('#introContainer .readme-content-wrapper');
                        if (wrapper && wrapper.innerHTML && wrapper.innerHTML.trim() !== '' && wrapper.innerHTML !== '<br>') {
                            showReadmeContainer('introContainer');
                        }
                    } else {
                        loadIntro();
                    }
                } else {
                    currentPath = category._path || [category.name];
                    currentCategory = category;
                    renderReadme(currentCategory);
                }
                renderBreadcrumb();
                renderList(currentCategory);
                if (!fromHistory && bgHistoryReady && !bgRestoring) {
                    bgPushCurrent();
                }
                document.querySelectorAll('#sidebar .multidisk').forEach(el => {
                    el.classList.remove('curr-disk');
                });
                document.querySelector('#sidebar .multidisk:first-child')?.classList.add('curr-disk');
                document.getElementById('mainScroll').scrollTo({ top: 0, behavior: 'smooth' });
                filterItems('');
            }, 150);
        }

        // ===== 特殊页面 =====
        function showSpecialPage(type, fromHistory = false) {
            // 修复bug3：如果还在加载资源，记录待处理的导航
            if (isLoadingResources && !fromHistory) {
                pendingNavigate = { type: 'special', page: type };
                return;
            }

            if (isPageAnimating) return;
            currentSpecialPage = type;

            if (!fromHistory && bgHistoryReady && !bgRestoring) {
                bgPushCurrent();
            }
            const fileList = document.getElementById('fileList');
            const specialContainer = document.getElementById('specialPageContainer');
            const content = document.getElementById('specialPageContent');
            const breadcrumb = document.getElementById('breadcrumbDisplay');
            hideAllReadme();

            document.getElementById('searchInput').value = '';
            searchQuery = '';

            const labels = {
                'links': '🔗 友情链接',
                'author': '👤 联系作者',
                'thanks': '❤️ 感谢名单',
                'settings': '⚙️ 设置'
            };
            breadcrumb.innerHTML = `<a style="font-weight:600;color:#333;">${labels[type] || '页面'}</a>`;
            if (fileList.style.display !== 'none') {
                fileList.classList.add('list-exit');
                setTimeout(() => {
                    fileList.style.display = 'none';
                    fileList.classList.remove('list-exit');
                    showSpecialPageContent(type, specialContainer, content);
                }, 300);
            } else {
                showSpecialPageContent(type, specialContainer, content);
            }
            document.querySelectorAll('#sidebar .multidisk').forEach(el => {
                el.classList.remove('curr-disk');
            });
            const map = { 'links': 1, 'author': 2, 'thanks': 3, 'settings': 4 };
            const idx = map[type];
            if (idx !== undefined) {
                const items = document.querySelectorAll('#sidebar .multidisk');
                if (items[idx]) items[idx].classList.add('curr-disk');
            }
            document.getElementById('mainScroll').scrollTo({ top: 0, behavior: 'smooth' });
            if (sidebarOpen) toggleSidebar();
        }

        function showSpecialPageContent(type, specialContainer, content) {
            specialContainer.style.display = '';
            if (content.className.includes('page-enter')) {
                content.className = 'page-content page-exit';
                isPageAnimating = true;
                setTimeout(() => {
                    content.className = 'page-content page-enter';
                    renderSpecialContent(type, content);
                    setTimeout(() => {
                        isPageAnimating = false;
                    }, 400);
                }, 350);
            } else {
                content.className = 'page-content page-enter';
                renderSpecialContent(type, content);
            }
        }

        function renderSpecialContent(type, content) {
            if (type === 'links') renderLinks(content);
            else if (type === 'author') renderAuthor(content);
            else if (type === 'thanks') renderThanks(content);
            else if (type === 'settings') renderSettings(content);
        }

        function hideSpecialPage(keepReadme = false) {
            const specialContainer = document.getElementById('specialPageContainer');
            const fileList = document.getElementById('fileList');
            specialContainer.style.display = 'none';
            fileList.style.display = '';
            fileList.classList.remove('list-exit', 'list-enter');
            currentSpecialPage = null;
            isPageAnimating = false;

            if (!keepReadme) {
                if (currentCategory && currentCategory.name === '根目录') {
                    if (introLoaded) {
                        const wrapper = document.querySelector('#introContainer .readme-content-wrapper');
                        if (wrapper) {
                            wrapper.classList.remove('entering', 'exiting');
                            wrapper.style.opacity = '0';
                            wrapper.style.transform = 'translateY(18px) scale(0.95)';
                        }
                        showReadmeContainer('introContainer');
                    }
                } else if (currentCategory) {
                    renderReadme(currentCategory);
                }
            }
        }

        // ===== 渲染链接 =====

                currentPath.forEach((name, index) => {
                    const found = categories.find(c => c.name === name);
                    if (found) {
                        html += ` > `;
                        if (index === currentPath.length - 1) {
                            html += `<a style="font-weight:600;color:#333;">${escapeHtml(name)}</a>`;
                        } else {
                            const pathStr = currentPath.slice(0, index + 1).join('|');
                            html += `<a onclick="navigateToByPath('${pathStr}')">${escapeHtml(name)}</a>`;

                        categories = found.children || [];
                    }
                });
            }
            container.innerHTML = html;

                applyViewMode();

                applyViewMode();

                return 0;

                                    <path d="M9 5V4.5C9 4.22386 8.77614 4 8.5 4H3.5C3.22386 4 3 4.22386 3 4.5V15.5C3 15.7761 3.22386 16 3.5 16H16.5C16.7761 16 17 15.7761 17 15.5V6.5C17 6.22386 16.7761 6 16.5 6H9V5Z" fill="#FFE08A" stroke="#E6A800" stroke-width="0.8"/>

                            </div>
                            <div class="main-items-fileName" style="flex:1;">
                                <a onclick="event.stopPropagation();navigateToByPath('${pathStr}')" style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.name)}</a>
                                ${item.desc ? `<span class="desc-text">${escapeHtml(item.desc)}</span>` : ''}
                            </div>
                            <div class="main-items-fileSize">
                                <span class="folder-info">📁 ${item.children ? item.children.length : 0} 项</span>
                            </div>
                        </div>
                    `;
                } else {
                    const icon = getFileIcon(item.src || item.url);
                    const itemName = escapeHtml(item.name);
                    const itemDesc = escapeHtml(item.desc || '');
                    const itemSrc = escapeHtml(item.src || item.url || '');
                    const loadedDesc = item._loadedData?.desc ? escapeHtml(item._loadedData.desc) : '';
                    // 修复bug1：确保readme路径正确传递
                    const readmePath = item.readme ? escapeHtml(item.readme) : '';
                    const loadedReadme = item._loadedReadme ? item._loadedReadme : '';
                    html += `
                        <div class="main-items">
                            <div class="main-items-icon">
                                <span style="font-size:20px;line-height:1;">${icon}</span>
                            </div>
                            <div class="main-items-fileName" style="flex:1;min-width:0;">
                                <span class="name-text">${itemName}</span>
                                ${itemDesc ? `<span class="desc-text">${itemDesc}</span>` : ''}
                                ${loadedDesc ? `<span class="desc-text" style="color:#666;">${loadedDesc}</span>` : ''}
                            </div>
                            <div class="main-items-fileSize">
                                <div class="file-actions">
                                    <a class="btn-detail" onclick="event.stopPropagation();openDetail({ name: '${itemName}', desc: '${itemDesc}', src: '${itemSrc}', url: '${itemSrc}', readme: '${readmePath}', _loadedData: ${JSON.stringify(item._loadedData || null)}, _loadedReadme: ${JSON.stringify(loadedReadme)} })">📄 查看详情</a>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
            applyViewMode();
            setCache(cacheKey, html);

            if (searchQuery) filterItems(searchQuery);
        }

        // ===== 渲染 README =====
        function renderReadme(category) {
            // 修复bug1：优先使用_loadedReadme，其次使用readme路径
            if (category._loadedReadme) {
                const html = renderMarkdown(category._loadedReadme);
                renderReadmeContent('readmeContainer', html);
                return;
            }

            let readmePath = category.readme || null;
            if (readmePath) {
                fetchWithRetry(readmePath)
                    .then(res => res.text())
                    .then(text => {
                        const html = renderMarkdown(text);
                        renderReadmeContent('readmeContainer', html);
                        category._loadedReadme = text;
                    })
                    .catch(() => {
                        const html = `<p style="color:#999;">📖 暂无说明文档</p>`;
                        renderReadmeContent('readmeContainer', html);
                    });
            } else {
                hideAllReadme();
            }
        }

        function renderMarkdown(text) {
            if (!text) return '<span style="color:#999;">暂无内容</span>';

            const lines = text.split('\n');
            let html = '';
            let i = 0;

            while (i < lines.length) {
                let line = lines[i];
                let trimmed = line.trim();

                if (!trimmed) {
                    html += '<br>';
                    i++;
                    continue;
                }

                if (trimmed.startsWith('# ')) {
                    html += `<h1>${trimmed.replace('# ', '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h1>`;
                    i++;
                    continue;
                }
                if (trimmed.startsWith('## ')) {
                    html += `<h2>${trimmed.replace('## ', '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h2>`;
                    i++;
                    continue;
                }
                if (trimmed.startsWith('### ')) {
                    html += `<h3>${trimmed.replace('### ', '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h3>`;
                    i++;
                    continue;
                }

                if (trimmed.startsWith('- ')) {
                    let items = [];
                    while (i < lines.length && lines[i].trim().startsWith('- ')) {
                        let item = lines[i].trim().replace('- ', '');
                        item = item.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        item = item.replace(/`([^`]+)`/g, '<code>$1</code>');
                        items.push(`<li>${item}</li>`);
                        i++;
                    }
                    html += `<ul>${items.join('')}</ul>`;
                    continue;
                }

                let escaped = trimmed.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
                html += `<p>${escaped}</p>`;
                i++;
            }

            return html;
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function getFileIcon(src) {
            if (!src) return '📄';
            const ext = src.split('.').pop().toLowerCase();
            const icons = {
                'json': '📋', 'md': '📝', 'txt': '📄', 'pdf': '📕',
                'zip': '📦', '7z': '📦', 'rar': '📦', 'apk': '📱',
                'exe': '⚙️', 'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️',
                'gif': '🖼️', 'svg': '🖼️', 'mp3': '🎵', 'mp4': '🎬',
                'avi': '🎬', 'mkv': '🎬', 'html': '🌐', 'css': '🎨',
                'js': '⚡', 'py': '🐍'
            };
            return icons[ext] || '📄';
        }

        // ===== 辅助函数 =====
        function showReadmeContainer(id) {
            const container = document.getElementById(id);
            if (!container) return;
            const otherId = id === 'introContainer' ? 'readmeContainer' : 'introContainer';
            const other = document.getElementById(otherId);
            if (other) {
                other.classList.remove('visible');
                other.classList.add('hidden');
            }
            container.classList.remove('hidden');
            container.classList.add('visible');

            const wrapper = container.querySelector('.readme-content-wrapper');
            if (wrapper) {
                wrapper.classList.remove('entering');
                void wrapper.offsetWidth;
                wrapper.classList.add('entering');
            }
        }

        function hideAllReadme() {
            ['introContainer', 'readmeContainer'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('visible');
                    el.classList.add('hidden');
                    const wrapper = el.querySelector('.readme-content-wrapper');
                    if (wrapper) {
                        wrapper.classList.remove('entering');
                    }
                }
            });
        }

        function renderReadmeContent(containerId, html) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const wrapper = container.querySelector('.readme-content-wrapper');
            if (!wrapper) return;
            wrapper.innerHTML = html;
            showReadmeContainer(containerId);
        }

        // ===== 详情弹窗 =====
        function openDetail(item) {
            currentDetailItem = item;
            const overlay = document.getElementById('detailOverlay');
            const title = document.getElementById('detailTitle');
            const body = document.getElementById('detailBody');
            const downloadBtn = document.getElementById('detailDownloadBtn');
            const linkUrl = item.src || item.url || (item._loadedData ? item._loadedData.url : null) || null;
            detailLink = linkUrl || '';
            title.textContent = `📄 ${item.name}`;
            overlay.classList.remove('closing', 'active');
            void overlay.offsetWidth;
            overlay.classList.add('active');
            if (linkUrl) {
                downloadBtn.href = linkUrl;
                downloadBtn.style.display = '';
                downloadBtn.textContent = `⬇ 点击下载 (${item.name})`;
            } else {
                downloadBtn.style.display = 'none';
            }
            let html = '';
            html += `<div class="detail-item">
                <span class="detail-label">📌 名称</span>
                <div class="detail-value">${escapeHtml(item.name)}</div>
            </div>`;
            const desc = item.desc || (item._loadedData ? item._loadedData.desc : '') || '';
            if (desc) {
                html += `<div class="detail-item">
                    <span class="detail-label">📝 描述</span>
                    <div class="detail-value">${escapeHtml(desc)}</div>
                </div>`;
            }
            if (linkUrl) {
                html += `<div class="detail-item">
                    <span class="detail-label">🔗 下载链接</span>
                    <div class="detail-value"><a href="${escapeHtml(linkUrl)}" target="_blank">${escapeHtml(linkUrl)}</a></div>
                </div>`;
            }
            // 修复bug1：优先使用_loadedReadme，其次使用readme路径
            const readmeContent = item._loadedReadme || null;
            const readmePath = item.readme || (item._loadedData ? item._loadedData.readme : null) || null;
            if (readmeContent) {
                html += `<div class="detail-item">
                    <span class="detail-label">📖 说明</span>
                    <div class="detail-readme">${renderMarkdown(readmeContent)}</div>
                </div>`;
                body.innerHTML = html;
            } else if (readmePath) {
                html += `<div class="detail-item">
                    <span class="detail-label">📖 说明</span>
                    <div class="detail-readme" id="detailReadmeLoading">⏳ 加载中...</div>
                </div>`;
                body.innerHTML = html;
                fetchWithRetry(readmePath)
                    .then(res => res.text())
                    .then(text => {
                        const readmeDiv = document.getElementById('detailReadmeLoading');
                        if (readmeDiv) {
                            readmeDiv.innerHTML = renderMarkdown(text);
                        }
                    })
                    .catch(() => {
                        const readmeDiv = document.getElementById('detailReadmeLoading');
                        if (readmeDiv) {
                            readmeDiv.innerHTML = `<span style="color:#999;">📄 无法加载说明文档</span>`;
                        }
                    });
            } else {
                html += `<div class="detail-item">
                    <span class="detail-label">📖 说明</span>
                    <div class="detail-value" style="color:#999;">暂无说明文档</div>
                </div>`;
                body.innerHTML = html;
            }
        }

        function closeDetail() {
            const overlay = document.getElementById('detailOverlay');
            overlay.classList.remove('active');
            overlay.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('closing');
            }, 200);
        }

        function copyDetailLink() {
            if (detailLink) {
                copyLink(detailLink, '链接');
            } else {
                showToast('❌ 没有链接可复制');
            }
        }

        function copyLink(src, name) {
            if (!src) {
                showToast('❌ 没有链接可复制');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(src).then(() => {
                    showToast(`✅ 已复制: ${name || '链接'}`);
                }).catch(() => {
                    fallbackCopy(src);
                });
            } else {
                fallbackCopy(src);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制链接');
            } catch (e) {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        function downloadFile(src, name) {
            if (!src) {
                showToast('❌ 没有下载链接');
                return;
            }
            const a = document.createElement('a');
            a.href = src;
            a.download = name || src.split('/').pop() || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(`⬇ 开始下载: ${name || '文件'}`);
        }

        // ===== 图片预览 =====
        function openImgPreview(src, name) {
            const overlay = document.getElementById('imgPreviewOverlay');
            const body = document.getElementById('imgPreviewBody');
            const title = document.getElementById('imgPreviewTitle');
            title.textContent = `📷 ${name || '图片预览'}`;
            body.innerHTML = `<img loading="lazy" src="${src}" alt="${name || '图片'}" onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'>❌ 图片加载失败</div>'">`;
            overlay.classList.remove('closing', 'active');
            void overlay.offsetWidth;
            overlay.classList.add('active');
        }

        function closeImgPreview() {
            const overlay = document.getElementById('imgPreviewOverlay');
            overlay.classList.remove('active');
            overlay.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('closing');
            }, 250);
        }

        // ===== 侧边栏 =====
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebarOpen) {
                sidebar.style.transform = 'translateX(0)';
                overlay.style.display = 'block';
                overlay.classList.add('active');
            } else {
                sidebar.style.transform = 'translateX(-260px)';
                overlay.classList.remove('active');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            }
        }

        function closeSidebar() {
            if (sidebarOpen) toggleSidebar();
        }

        // ===== Toast =====
        function showToast(msg) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 3000);
        }

        // ===== 初始化 =====
        document.getElementById('foot_info').innerHTML =
            `Copyright © ${new Date().getFullYear()} | 白叶114514の资源站 | 主题来自于 雪中明月 大佬`;

        document.getElementById('introContainer').classList.add('hidden');
        document.getElementById('readmeContainer').classList.add('hidden');

        // 页面加载时立即应用暗色模式（根据 localStorage）
        if (localStorage.getItem(CONFIG.darkModeKey) === 'true') {
            document.body.classList.add('dark-mode');
        }

        loadData();
    </script>
</body>
