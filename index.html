<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白叶141の资源站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            color: #333;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            overflow: hidden;
        }
        a {
            text-decoration: none;
            font-weight: 400;
            color: rgb(97, 97, 97);
            transition: 0.5s;
            cursor: pointer;
        }
        a:hover {
            color: rgb(36, 36, 36);
        }
        ul {
            list-style: none;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            position: relative;
        }
        .container {
            margin-left: auto;
            margin-right: auto;
            max-width: 1100px;
        }
        header {
            width: 100%;
            line-height: 48px;
            background-color: rgba(255, 255, 255, 0.5);
            position: fixed;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        header nav a {
            color: rgb(36, 36, 36);
            font-weight: 600;
            transition: 0.5s;
        }
        nav svg {
            width: 20px;
            height: 20px;
        }
        nav div {
            min-width: 48px;
            height: 48px;
            transition: 0.5s;
        }
        .pull-left {
            float: left;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pull-right {
            float: right;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .expand {
            transform: rotate(0deg);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .expand_on {
            transform: rotate(-90deg);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        nav a {
            padding: 0 20px;
        }
        nav div:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        main {
            position: relative;
            height: 100%;
            background: #f0f0f4;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
        .scroll {
            overflow-y: auto;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 48px 0 100px 0;
        }
        .scroll::-webkit-scrollbar {
            width: 5px;
        }
        .scroll::-webkit-scrollbar-thumb {
            background: #a8a8a8;
        }
        .scroll::-webkit-scrollbar-button {
            display: none;
        }
        main .main-item-list {
            display: flex;
            flex-direction: column;
            height: auto;
            background: rgba(255, 255, 255, 0.8);
            margin: 20px;
            line-height: 32px;
            font-size: 14px;
            box-sizing: border-box;
            border-radius: 12px;
            border: #e0e0e0 solid 1px;
            padding: 12px 0;
            backdrop-filter: blur(20px);
            transition: 0.3s;
        }
        main .main-title h1 {
            margin: 0;
            padding: 32px 32px 10px 32px;
            font-size: 19px;
            font-weight: 600;
        }
        div.main-title>h1>a:last-of-type {
            font-weight: 600;
            color: rgb(36, 36, 36);
        }
        main .main-item-list .inner-container {
            display: flex;
            justify-content: flex-start;
            width: 100%;
            height: auto;
            box-sizing: border-box;
        }
        main .main-item-list .inner-container>div {
            padding-left: 12px;
            padding-right: 8px;
            box-sizing: border-box;
            text-wrap: nowrap;
            font-weight: 600;
        }
        div.main-items.main-item-title>div>div.main-items-icon {
            display: none;
        }
        main .main-item-list .main-item-title {
            border-bottom: 1px solid #EAEAEA;
        }
        main .main-items {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            padding: 0 20px;
            overflow: hidden;
            transition: 0.5s;
            margin-top: 2.5px;
            margin-bottom: 2.5px;
            cursor: default;
            min-height: 48px;
        }
        main .main-items:hover {
            background-color: #F4F4F4;
            transform: scale(0.980);
            border-radius: 10px;
            transition: 0.3s;
        }
        main .main-item-list .main-items-icon {
            min-width: 38px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        main .main-item-list .main-items-icon img {
            display: block;
            width: 20px;
            height: 20px;
        }
        main .main-item-list .main-items-icon .iconfont {
            font-size: 20px;
            line-height: 1;
        }
        main .main-item-title .main-items-icon {
            height: 32px !important;
            line-height: 9px !important;
        }
        main .main-item-title .main-items-icon:hover,
        main .main-item-list .main-items-displayName:hover,
        main .main-item-list .main-items-dateModified:hover,
        main .main-item-list .main-items-size:hover {
            background-color: #EAEAEA;
        }
        main .main-item-list .main-items-displayName,
        main .main-item-list .main-items-fileName {
            flex: 1;
            padding: 11px 8px 11px 12px;
            min-height: 42px;
            line-height: 22px;
            font-family: "Microsoft Yahei UI", Verdana, Simsun, "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        main .main-item-list .main-items-fileName .name-text {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
        }
        main .main-item-list .main-items-fileName .desc-text {
            color: #999;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        main .main-item-list .main-items-fileName a {
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            color: inherit;
            align-items: center;
            max-width: 100%;
            white-space: nowrap;
        }
        main .main-item-list .main-items-fileName a:hover {
            text-decoration: underline;
        }
        main .main-item-list .main-items-dateModified,
        main .main-item-list .main-items-dateTime {
            width: 140px;
            text-align: center;
            flex: 1;
            padding: 11px 8px 11px 12px;
            min-height: 42px;
            line-height: 22px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main .main-item-list .main-items-size,
        main .main-item-list .main-items-fileSize {
            padding: 11px 8px 11px 12px;
            min-height: 42px;
            line-height: 22px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
            gap: 6px;
        }
        .file-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .file-actions a {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        .file-actions .btn-detail {
            color: #0078d4;
            background: rgba(0, 120, 212, 0.08);
        }
        .file-actions .btn-detail:hover {
            background: rgba(0, 120, 212, 0.15);
        }
        .folder-info {
            color: #999;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        @media screen and (max-width: 600px) {
            .file-actions a {
                padding: 2px 8px;
                font-size: 11px;
            }
            .file-actions {
                gap: 4px;
            }
            main .main-item-list .main-items-fileSize {
                padding: 11px 4px;
            }
            .desc-text {
                display: none !important;
            }
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #999;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .readme {
            padding: 10px 20px;
        }
        .markdown-body {
            font-size: 14px;
            line-height: 1.8;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin: 16px 0 8px 0;
        }
        .markdown-body ul {
            padding-left: 20px;
        }
        .markdown-body code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        #foot_info {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #888;
        }
        #sidebarOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 8;
            transition: background 0.3s ease;
            pointer-events: none;
            display: none;
        }
        #sidebarOverlay.active {
            background: rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }
        #sidebar {
            position: fixed;
            background: white;
            height: 100%;
            padding: 20px;
            padding-top: 60px;
            width: 220px;
            transition: 0.5s;
            display: flex;
            flex-direction: column;
            z-index: 9;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transform: translateX(-260px);
            overflow-y: auto;
        }
        #sidebar svg {
            min-width: 24px;
            height: 24px;
            padding-right: 15px;
        }
        .multidisk {
            display: flex;
            font-size: 16px;
            padding: 10px;
            transition: 0.5s;
            margin: 2px 0;
            align-items: center;
            justify-content: flex-start;
            border-radius: 8px;
            cursor: pointer;
        }
        .multidisk:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        .curr-disk {
            background: rgba(0, 120, 212, 0.1);
            font-weight: 600;
            color: #0078d4;
        }
        .folder-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .folder-item:active {
            transform: scale(0.95);
            background-color: #e8f0fe;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        #fileItems .main-items {
            animation: fadeInUp 0.3s ease forwards;
        }
        #fileItems .main-items:nth-child(1) { animation-delay: 0.00s; }
        #fileItems .main-items:nth-child(2) { animation-delay: 0.03s; }
        #fileItems .main-items:nth-child(3) { animation-delay: 0.06s; }
        #fileItems .main-items:nth-child(4) { animation-delay: 0.09s; }
        #fileItems .main-items:nth-child(5) { animation-delay: 0.12s; }
        #fileItems .main-items:nth-child(6) { animation-delay: 0.15s; }
        #fileItems .main-items:nth-child(7) { animation-delay: 0.18s; }
        #fileItems .main-items:nth-child(8) { animation-delay: 0.21s; }
        #fileItems .main-items:nth-child(9) { animation-delay: 0.24s; }
        #fileItems .main-items:nth-child(10) { animation-delay: 0.27s; }
        #fileItems .main-items:nth-child(11) { animation-delay: 0.30s; }
        #fileItems .main-items:nth-child(12) { animation-delay: 0.33s; }
        #fileItems .main-items:nth-child(13) { animation-delay: 0.36s; }
        #fileItems .main-items:nth-child(14) { animation-delay: 0.39s; }
        #fileItems .main-items:nth-child(15) { animation-delay: 0.42s; }
        #fileItems .main-items:nth-child(16) { animation-delay: 0.45s; }
        #fileItems .main-items:nth-child(17) { animation-delay: 0.48s; }
        #fileItems .main-items:nth-child(18) { animation-delay: 0.51s; }
        #fileItems .main-items:nth-child(19) { animation-delay: 0.54s; }
        #fileItems .main-items:nth-child(20) { animation-delay: 0.57s; }

        .readme-item {
            opacity: 0;
            animation: fadeInUp 0.3s ease forwards;
        }
        .readme-item:nth-child(1) { animation-delay: 0.00s; }
        .readme-item:nth-child(2) { animation-delay: 0.03s; }
        .readme-item:nth-child(3) { animation-delay: 0.06s; }
        .readme-item:nth-child(4) { animation-delay: 0.09s; }
        .readme-item:nth-child(5) { animation-delay: 0.12s; }
        .readme-item:nth-child(6) { animation-delay: 0.15s; }
        .readme-item:nth-child(7) { animation-delay: 0.18s; }
        .readme-item:nth-child(8) { animation-delay: 0.21s; }
        .readme-item:nth-child(9) { animation-delay: 0.24s; }
        .readme-item:nth-child(10) { animation-delay: 0.27s; }
        .readme-item:nth-child(11) { animation-delay: 0.30s; }
        .readme-item:nth-child(12) { animation-delay: 0.33s; }
        .readme-item:nth-child(13) { animation-delay: 0.36s; }
        .readme-item:nth-child(14) { animation-delay: 0.39s; }
        .readme-item:nth-child(15) { animation-delay: 0.42s; }
        .readme-item:nth-child(16) { animation-delay: 0.45s; }
        .readme-item:nth-child(17) { animation-delay: 0.48s; }
        .readme-item:nth-child(18) { animation-delay: 0.51s; }
        .readme-item:nth-child(19) { animation-delay: 0.54s; }
        .readme-item:nth-child(20) { animation-delay: 0.57s; }
        .readme-item:nth-child(21) { animation-delay: 0.60s; }
        .readme-item:nth-child(22) { animation-delay: 0.63s; }
        .readme-item:nth-child(23) { animation-delay: 0.66s; }
        .readme-item:nth-child(24) { animation-delay: 0.69s; }
        .readme-item:nth-child(25) { animation-delay: 0.72s; }
        .readme-item:nth-child(26) { animation-delay: 0.75s; }
        .readme-item:nth-child(27) { animation-delay: 0.78s; }
        .readme-item:nth-child(28) { animation-delay: 0.81s; }
        .readme-item:nth-child(29) { animation-delay: 0.84s; }
        .readme-item:nth-child(30) { animation-delay: 0.87s; }

        #introContainer,
        #readmeContainer {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #introContainer.hidden,
        #readmeContainer.hidden {
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            display: none;
        }
        #introContainer.visible,
        #readmeContainer.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            display: flex;
        }

        .detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.2s ease, backdrop-filter 0.2s ease;
            display: flex;
            pointer-events: none;
        }
        .detail-overlay.active {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        .detail-overlay.closing {
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            pointer-events: none;
        }
        .detail-overlay.closing .detail-modal {
            transform: scale(0.95) translateY(20px);
            opacity: 0;
        }
        .detail-modal {
            background: white;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }
        .detail-overlay.active .detail-modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .detail-header h3 {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 80%;
        }
        .detail-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0 8px;
            transition: 0.2s;
            line-height: 1;
        }
        .detail-close:hover {
            color: #333;
            transform: scale(1.1);
        }
        .detail-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            font-size: 14px;
            line-height: 1.8;
        }
        .detail-body .detail-item {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-body .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .detail-body .detail-label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .detail-body .detail-value {
            color: #333;
            word-break: break-all;
        }
        .detail-body .detail-value a {
            color: #0078d4;
        }
        .detail-body .detail-value a:hover {
            text-decoration: underline;
        }
        .detail-body .detail-readme {
            background: #f8f8fa;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.8;
            max-height: 250px;
            overflow-y: auto;
        }
        .detail-body .detail-readme h1,
        .detail-body .detail-readme h2,
        .detail-body .detail-readme h3 {
            margin: 6px 0 4px 0;
            font-size: 15px;
        }
        .detail-body .detail-readme ul {
            padding-left: 20px;
        }
        .detail-body .detail-readme code {
            background: #e8e8e8;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .detail-body .loading-text {
            color: #999;
            text-align: center;
            padding: 20px 0;
        }
        .detail-body .error-text {
            color: #dc2626;
            text-align: center;
            padding: 20px 0;
        }
        .detail-footer {
            padding: 12px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .detail-footer a,
        .detail-footer button {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }
        .detail-footer .btn-download-detail {
            background: #16a34a;
            color: white;
        }
        .detail-footer .btn-download-detail:hover {
            background: #15803d;
        }
        .detail-footer .btn-copy-detail {
            background: #f3f4f6;
            color: #333;
        }
        .detail-footer .btn-copy-detail:hover {
            background: #e5e7eb;
        }
        .detail-footer .btn-close-detail {
            background: #f3f4f6;
            color: #333;
        }
        .detail-footer .btn-close-detail:hover {
            background: #e5e7eb;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            opacity: 1;
        }
        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .settings-item:last-child {
            border-bottom: none;
        }
        .settings-item .settings-label {
            font-weight: 500;
            font-size: 15px;
        }
        .settings-item .settings-desc {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }
        .settings-item .settings-control {
            flex-shrink: 0;
        }
        .toggle-switch {
            width: 48px;
            height: 26px;
            background: #ccc;
            border-radius: 13px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: #0078d4;
        }
        .toggle-switch .toggle-knob {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .toggle-switch.active .toggle-knob {
            left: 24px;
        }
        .friend-link-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px 20px;
        }
        .friend-link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;

    <script>
        let allData = null;
        let currentPath = [];
        let currentCategory = null;
        let flatItems = [];
        let sidebarOpen = false;
        let currentDetailItem = null;
        let detailLink = '';
        let musicEnabled = false;
        let musicList = [];
        let audioPlayer = null;
        let musicPlaying = false;
        let musicPlayedIndices = [];
        let currentSpecialPage = null;
        let isPageAnimating = false;
        let toastTimer = null;
        let introLoaded = false;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function toggleSidebar() {
            if (sidebarOpen) {
                closeSidebar();
            } else {
                openSidebar();
            }
        }

        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const icon = document.getElementById('expand');
            sidebar.style.transform = 'translateX(0px)';
            icon.className = 'pull-left expand_on';
            overlay.style.display = 'block';
            setTimeout(() => {
                overlay.classList.add('active');
            }, 10);
            sidebarOpen = true;
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const icon = document.getElementById('expand');
            sidebar.style.transform = 'translateX(-260px)';
            icon.className = 'pull-left expand';
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
            sidebarOpen = false;
        }

        function showReadmeContainer(containerId) {
            const intro = document.getElementById('introContainer');
            const folder = document.getElementById('readmeContainer');
            intro.classList.remove('visible');
            folder.classList.remove('visible');
            intro.classList.add('hidden');
            folder.classList.add('hidden');
            const target = document.getElementById(containerId);
            target.classList.remove('hidden');
            target.classList.add('visible');
        }

        function renderReadmeContent(containerId, html) {
            const container = document.getElementById(containerId);
            const readmeDiv = container.querySelector('.readme');
            readmeDiv.innerHTML = html;
            const items = readmeDiv.children;
            for (let i = 0; i < items.length; i++) {
                items[i].classList.add('readme-item');
                items[i].style.animation = 'none';
                void items[i].offsetWidth;
                items[i].style.animation = '';
            }
            showReadmeContainer(containerId);
        }

        function hideAllReadme() {
            const intro = document.getElementById('introContainer');
            const folder = document.getElementById('readmeContainer');
            intro.classList.remove('visible');
            folder.classList.remove('visible');
            intro.classList.add('hidden');
            folder.classList.add('hidden');
        }

        async function loadData() {
            try {
                const response = await fetch('resources.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allData = await response.json();
                await loadAllLoaders(allData.categories);
                flatItems = [];
                buildFlatIndex(allData.categories, []);
                const count = flatItems.filter(i => i.type === 'loader' || i.type === 'file').length;
                document.getElementById('statsDisplay').textContent = `📦 ${count} 个资源`;
                await loadMusicList();
                await loadIntro();
                navigateTo(null);
            } catch (error) {
                document.getElementById('fileItems').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>加载失败: ${error.message}</p>
                        <p style="font-size:13px;color:#bbb;margin-top:8px;">请确保 resources.json 文件存在</p>
                    </div>
                `;
                console.error('加载失败:', error);
            }
        }

        async function loadIntro() {
            try {
                const res = await fetch('data/main.md');
                if (res.ok) {
                    const text = await res.text();
                    const html = renderMarkdown(text);
                    document.getElementById('introReadme').innerHTML = html;
                    introLoaded = true;
                } else {
                    introLoaded = false;
                }
            } catch (e) {
                introLoaded = false;
                console.warn('资源介绍加载失败:', e);
            }
        }

        async function loadAllLoaders(categories) {
            for (const cat of categories) {
                if (cat.type === 'loader' && cat.src) {
                    try {
                        let src = cat.src;
                        let anchor = null;
                        if (src.includes('#')) {
                            const parts = src.split('#');
                            src = parts[0];
                            anchor = parts[1];
                        }
                        console.log('📥 加载:', src, anchor ? `→ ${anchor}` : '');
                        const res = await fetch(src);
                        if (res.ok) {
                            let data = await res.json();
                            if (anchor) {
                                if (data[anchor]) {
                                    data = data[anchor];
                                    if (Array.isArray(data)) {
                                        cat.children = data;
                                        cat.type = 'folder';
                                        await loadAllLoaders(cat.children);
                                        continue;
                                    }
                                    if (data.children && Array.isArray(data.children)) {
                                        cat.children = data.children;
                                        cat.type = 'folder';
                                        if (data.desc && !cat.desc) cat.desc = data.desc;
                                        if (data.readme && !cat.readme) cat.readme = data.readme;
                                        await loadAllLoaders(cat.children);
                                        continue;
                                    }
                                } else {
                                    console.warn('⚠️ 锚点不存在:', anchor);
                                    continue;
                                }
                            }
                            if (data.children && Array.isArray(data.children) && data.children.length > 0) {
                                cat.type = 'folder';
                                if (data.desc && !cat.desc) cat.desc = data.desc;
                                if (data.readme && !cat.readme) cat.readme = data.readme;
                                if (cat.children) {
                                    cat.children = cat.children.concat(data.children);
                                } else {
                                    cat.children = data.children;
                                }
                                await loadAllLoaders(cat.children);
                            } else {
                                cat._loadedData = data;
                                if (data.readme) {
                                    try {
                                        const rmRes = await fetch(data.readme);
                                        if (rmRes.ok) {
                                            cat._loadedReadme = await rmRes.text();
                                        } else {
                                            console.warn('📄 README 404:', data.readme);
                                        }
                                    } catch (e) {
                                        console.warn('📄 README 加载失败:', data.readme);
                                    }
                                }
                                if (data.url) cat._url = data.url;
                                if (data.desc && !cat.desc) cat.desc = data.desc;
                            }
                        } else {
                            console.warn('❌ HTTP', res.status, ':', src);
                        }
                    } catch (e) {
                        console.warn('❌ 加载失败:', cat.src, e);
                    }
                }
                if (cat.children) {
                    await loadAllLoaders(cat.children);
                }
            }
        }

        function buildFlatIndex(categories, parentPath = []) {
            categories.forEach(cat => {
                const fullPath = [...parentPath, cat.name];
                cat._path = fullPath;
                flatItems.push({ ...cat, _path: fullPath, _pathStr: fullPath.join(' / ') });
                if (cat.children) {
                    buildFlatIndex(cat.children, fullPath);
                }
            });
        }

        async function loadMusicList() {
            try {
                const response = await fetch('data/music.json');
                if (response.ok) {
                    musicList = await response.json();
                } else {
                    console.warn('音乐列表加载失败');
                    musicList = [];
                }
            } catch (e) {
                console.warn('音乐列表加载异常:', e);
                musicList = [];
            }
        }

        function toggleMusic() {
            if (!musicEnabled) {
                if (audioPlayer) {
                    audioPlayer.pause();
                    audioPlayer = null;
                }
                musicPlaying = false;
                showToast('🔇 音乐已关闭');
                return;
            }
            if (musicList.length === 0) {
                showToast('❌ 没有可播放的音乐');
                return;
            }
            if (audioPlayer && musicPlaying) {
                audioPlayer.pause();
                musicPlaying = false;
                showToast('⏸️ 已暂停');
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
                return;
            }
            if (audioPlayer && !musicPlaying) {
                audioPlayer.play().catch(() => {});
                musicPlaying = true;
                showToast('▶️ 继续播放');
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
                return;
            }
            playRandomMusic();
        }

        function playRandomMusic() {
            if (musicList.length === 0) return;
            if (musicPlayedIndices.length >= musicList.length) {
                musicPlayedIndices = [];
            }
            const availableIndices = [];
            for (let i = 0; i < musicList.length; i++) {
                if (!musicPlayedIndices.includes(i)) {
                    availableIndices.push(i);
                }
            }
            if (availableIndices.length === 0) {
                musicPlayedIndices = [];
                playRandomMusic();
                return;
            }
            const randomIdx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            musicPlayedIndices.push(randomIdx);
            const item = musicList[randomIdx];
            if (!item || !item.url) {
                showToast('❌ 无法播放: ' + (item ? item.name : '未知'));
                playRandomMusic();
                return;
            }
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
            audioPlayer = new Audio(item.url);
            audioPlayer.volume = 0.7;
            audioPlayer.addEventListener('ended', () => {
                if (musicEnabled) {
                    playRandomMusic();
                }
            });
            audioPlayer.addEventListener('error', () => {
                showToast('❌ 播放失败: ' + item.name);
                setTimeout(() => {
                    if (musicEnabled) {
                        playRandomMusic();
                    }
                }, 2000);
            });
            audioPlayer.play().then(() => {
                musicPlaying = true;
                showToast(`🎵 正在播放: ${item.name}`);
                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));
                }
            }).catch(() => {
                showToast('❌ 无法播放: ' + item.name);
            });
        }

        function stopMusic() {
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
            musicPlaying = false;
            musicPlayedIndices = [];
        }

        function navigateToByPath(pathInput) {
            hideSpecialPage();
            if (!pathInput) {
                navigateTo(null);
                return;
            }
            let names;
            if (Array.isArray(pathInput)) {
                names = pathInput;
            } else {
                names = pathInput.split('|').filter(Boolean);
            }
            if (names.length === 0) {
                navigateTo(null);
                return;
            }
            let current = {
                name: '根目录',
                type: 'root',
                children: allData.categories
            };
            let path = [];
            for (const name of names) {
                const next = (current.children || []).find(item => item.name === name);
                if (!next) {
                    console.warn('未找到路径:', name);
                    return;
                }
                path.push(name);
                current = next;
            }
            current._path = path;
            navigateTo(current);
        }

        function navigateTo(category) {
            hideSpecialPage();
            const fileList = document.getElementById('fileList');
            const specialContainer = document.getElementById('specialPageContainer');
            specialContainer.style.display = 'none';
            if (fileList.style.display !== 'none') {
                fileList.classList.add('list-exit');
                setTimeout(() => {
                    fileList.classList.remove('list-exit');
                    fileList.classList.add('list-enter');
                    setTimeout(() => {
                        fileList.classList.remove('list-enter');
                    }, 400);
                }, 300);
            }
            setTimeout(() => {
                if (category === null) {
                    currentPath = [];
                    currentCategory = {
                        name: '根目录',
                        type: 'root',
                        children: allData.categories
                    };
                    if (introLoaded) {
                        const introContainer = document.getElementById('introContainer');
                        const readmeDiv = introContainer.querySelector('.readme');
                        const items = readmeDiv.children;
                        for (let i = 0; i < items.length; i++) {
                            items[i].classList.add('readme-item');
                            items[i].style.animation = 'none';
                            void items[i].offsetWidth;
                            items[i].style.animation = '';
                        }
                        showReadmeContainer('introContainer');
                    } else {
                        hideAllReadme();
                    }
                } else {
                    currentPath = category._path || [category.name];
                    currentCategory = category;
                    renderReadme(currentCategory);
                }
                renderBreadcrumb();
                renderList(currentCategory);
                document.querySelectorAll('#sidebar .multidisk').forEach(el => {
                    el.classList.remove('curr-disk');
                });

                document.getElementById('mainScroll').scrollTo({ top: 0, behavior: 'smooth' });

        function showSpecialPage(type) {
            if (isPageAnimating) return;
            currentSpecialPage = type;
            const fileList = document.getElementById('fileList');
            const specialContainer = document.getElementById('specialPageContainer');
            const content = document.getElementById('specialPageContent');
            const breadcrumb = document.getElementById('breadcrumbDisplay');
            hideAllReadme();
            const labels = {
                'links': '🔗 友情链接',
                'author': '👤 联系作者',
                'settings': '⚙️ 设置'
            };

            if (fileList.style.display !== 'none') {
                fileList.classList.add('list-exit');
                setTimeout(() => {
                    fileList.style.display = 'none';
                    fileList.classList.remove('list-exit');
                    showSpecialPageContent(type, specialContainer, content);

                showSpecialPageContent(type, specialContainer, content);

                el.classList.remove('curr-disk');
            });

                const items = document.querySelectorAll('#sidebar .multidisk');
                if (items[idx]) items[idx].classList.add('curr-disk');
            }
            document.getElementById('mainScroll').scrollTo({ top: 0, behavior: 'smooth' });

        function showSpecialPageContent(type, specialContainer, content) {
            specialContainer.style.display = '';
            if (content.className.includes('page-enter')) {
                content.className = 'page-content page-exit';
                isPageAnimating = true;
                setTimeout(() => {
                    content.className = 'page-content page-enter';
                    renderSpecialContent(type, content);
                    setTimeout(() => {
                        isPageAnimating = false;
                    }, 400);
                }, 350);
            } else {
                content.className = 'page-content page-enter';
                renderSpecialContent(type, content);
            }
        }

        function renderSpecialContent(type, content) {
            if (type === 'links') renderLinks(content);
            else if (type === 'author') renderAuthor(content);
            else if (type === 'settings') renderSettings(content);
        }

            const specialContainer = document.getElementById('specialPageContainer');

        function renderSettings(container) {
            const isMusicOn = musicEnabled;
            let currentSongName = '';

                const lastIdx = musicPlayedIndices[musicPlayedIndices.length - 1];
                if (lastIdx !== undefined && musicList[lastIdx]) {
                    currentSongName = musicList[lastIdx].name || '';
                }
            }
            container.innerHTML = `
                <div class="settings-item">
                    <div>
                        <div class="settings-label">🎵 音乐播放开关</div>

                            <div class="toggle-knob"></div>

                </div>

                    <div style="padding:10px 20px 14px 20px;font-size:13px;color:#0078d4;border-bottom:1px solid #f0f0f0;">

                ` : ''}
                ${isMusicOn && !musicPlaying && musicList.length > 0 ? `

        function toggleMusicSetting(el) {
            musicEnabled = !musicEnabled;
            el.classList.toggle('active', musicEnabled);
            if (musicEnabled) {
                if (musicList.length > 0) {
                    if (!audioPlayer || !musicPlaying) {
                        playRandomMusic();
                    }

                    showToast('⚠️ 没有可播放的音乐');

                if (currentSpecialPage === 'settings') {
                    renderSettings(document.getElementById('specialPageContent'));

        function renderBreadcrumb() {
            const container = document.getElementById('breadcrumbDisplay');
            let html = `<a onclick="navigateTo(null)">📂 根目录</a>`;
            if (currentPath.length > 0) {
                let categories = allData.categories;
                currentPath.forEach((name, index) => {
                    const found = categories.find(c => c.name === name);
                    if (found) {
                        html += ` > `;
                        if (index === currentPath.length - 1) {
                            html += `<a style="font-weight:600;color:#333;">${name}</a>`;
                        } else {
                            const pathStr = currentPath.slice(0, index + 1).join('|');
                            html += `<a onclick="navigateToByPath('${pathStr}')">${name}</a>`;
                        }
                        categories = found.children || [];
                    }
                });
            }
            container.innerHTML = html;
        }

        function copyLink(src, name) {
            if (!src) {
                showToast('❌ 没有链接可复制');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(src).then(() => {
                    showToast(`✅ 已复制: ${name || '链接'}`);
                }).catch(() => {
                    fallbackCopy(src);
                });
            } else {
                fallbackCopy(src);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制链接');
            } catch (e) {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        function downloadFile(src, name) {
            if (!src) {
                showToast('❌ 没有下载链接');
                return;
            }
            const a = document.createElement('a');
            a.href = src;
            a.download = name || src.split('/').pop() || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(`⬇ 开始下载: ${name || '文件'}`);
        }

                                </svg>
                            </div>
                            <div class="main-items-fileName" style="flex:1;">
                                <a onclick="event.stopPropagation();navigateToByPath('${pathStr}')" style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</a>
                                ${item.desc ? `<span class="desc-text">${item.desc}</span>` : ''}
                            </div>
                            <div class="main-items-fileSize">
                                <span class="folder-info">📁 ${item.children ? item.children.length : 0} 项</span>
                            </div>
                        </div>
                    `;
                } else {
                    const icon = getFileIcon(item.src || item.url);
                    html += `
                        <div class="main-items">
                            <div class="main-items-icon">
                                <span style="font-size:20px;line-height:1;">${icon}</span>
                            </div>
                            <div class="main-items-fileName" style="flex:1;min-width:0;">
                                <span class="name-text">${item.name}</span>
                                ${item.desc ? `<span class="desc-text">${item.desc}</span>` : ''}
                                ${item._loadedData?.desc ? `<span class="desc-text" style="color:#666;">${item._loadedData.desc}</span>` : ''}
                            </div>
                            <div class="main-items-fileSize">
                                <div class="file-actions">
                                    <a class="btn-detail" onclick="event.stopPropagation();openDetail({ name: '${escapeHtml(item.name)}', desc: '${escapeHtml(item.desc || '')}', src: '${item.src || ''}', url: '${item.url || ''}', readme: '${item.readme || ''}', _loadedData: ${JSON.stringify(item._loadedData || null)}, _loadedReadme: ${JSON.stringify(item._loadedReadme || null)} })">📄 查看详情</a>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
        }

        function renderReadme(category) {
            let readmePath = category ? category.readme : null;
            let loadedReadme = category ? category._loadedReadme : null;
            if (category && category.type === 'loader' && loadedReadme) {
                const html = renderMarkdown(loadedReadme);
                renderReadmeContent('readmeContainer', html);
                return;
            }
            if (readmePath) {
                fetch(readmePath)
                    .then(res => {
                        if (!res.ok) throw new Error('文件不存在');
                        return res.text();
                    })
                    .then(text => {
                        const html = renderMarkdown(text);
                        renderReadmeContent('readmeContainer', html);
                    })
                    .catch(() => {
                        const html = `<p style="color:#999;">📖 暂无说明文档</p>`;
                        renderReadmeContent('readmeContainer', html);
                    });
            } else {
                hideAllReadme();
            }
        }

        function renderMarkdown(text) {
            if (!text) return '<span style="color:#999;">暂无内容</span>';
            
            const lines = text.split('\n');
            let html = '';
            let i = 0;
            
            while (i < lines.length) {
                let line = lines[i];
                let trimmed = line.trim();
                
                if (!trimmed) {
                    html += '<br>';
                    i++;
                    continue;
                }
                
                if (trimmed.startsWith('# ')) {
                    html += `<h1>${trimmed.replace('# ', '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h1>`;
                    i++;
                    continue;
                }
                if (trimmed.startsWith('## ')) {
                    html += `<h2>${trimmed.replace('## ', '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h2>`;
                    i++;
                    continue;
                }
                if (trimmed.startsWith('### ')) {
                    html += `<h3>${trimmed.replace('### ', '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h3>`;
                    i++;
                    continue;
                }
                
                if (trimmed.startsWith('- ')) {
                    let items = [];
                    while (i < lines.length && lines[i].trim().startsWith('- ')) {
                        let item = lines[i].trim().replace('- ', '');
                        item = item.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        item = item.replace(/`([^`]+)`/g, '<code>$1</code>');
                        items.push(`<li>${item}</li>`);
                        i++;
                    }
                    html += `<ul>${items.join('')}</ul>`;
                    continue;
                }
                
                let escaped = trimmed.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
                html += `<p>${escaped}</p>`;
                i++;
            }
            
            return html;
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function getFileIcon(src) {
            if (!src) return '📄';
            const ext = src.split('.').pop().toLowerCase();
            const icons = {
                'json': '📋',
                'md': '📝',
                'txt': '📄',
                'pdf': '📕',
                'zip': '📦',
                '7z': '📦',
                'rar': '📦',
                'apk': '📱',
                'exe': '⚙️',
                'png': '🖼️',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'gif': '🖼️',
                'svg': '🖼️',
                'mp3': '🎵',
                'mp4': '🎬',
                'avi': '🎬',
                'mkv': '🎬',
                'html': '🌐',
                'css': '🎨',
                'js': '⚡',
                'py': '🐍'
            };
            return icons[ext] || '📄';
        }

        document.getElementById('foot_info').innerHTML =
            `Copyright © ${new Date().getFullYear()} | 白叶114514の资源站 | 主题来自于 雪中明月 大佬`;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDetail();
                closeImgPreview();
                if (sidebarOpen) closeSidebar();
            }
        });

        document.getElementById('introContainer').classList.add('hidden');
        document.getElementById('readmeContainer').classList.add('hidden');

        loadData();
    </script>
</body>
</html>
